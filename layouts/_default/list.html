{{ define "main" }}
<section class="intro">
  <h1>{{ .Title }}</h1>
  {{ with .Content }}<div class="prose">{{ . }}</div>{{ end }}
</section>
<section class="archive">
  {{ range .Pages.GroupByDate "2006" }}
  <div class="year-group">
    <div class="year-rail"><span class="year">{{ .Key }}</span></div>
    <ul class="post-list">
      {{ range .Pages }}
      <li>
        <a href="{{ .RelPermalink }}">{{ .Title }}</a>
        {{ with index .Params.tags 0 }}<span class="post-tag">{{ . }}</span>{{ end }}
        <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2 Jan" }}</time>
      </li>
      {{ end }}
    </ul>
  </div>
  {{ end }}
</section>
{{ end }}
