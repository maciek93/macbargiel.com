{{ define "main" }}
<article class="post">
  <div class="post-rail">
    {{ with index .Params.tags 0 }}<span class="kicker">{{ . }}</span>{{ end }}
    {{ if and .Date (eq .Section "posts") }}
    <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2 January 2006" }}</time>
    {{ end }}
  </div>
  <div class="post-body">
    <h1>{{ .Title }}</h1>
    <div class="prose">
      {{ .Content }}
    </div>
    {{ with .Params.tags }}
    <div class="tags">
      {{ range . }}<span class="tag">{{ . }}</span>{{ end }}
    </div>
    {{ end }}
  </div>
</article>
{{ end }}
